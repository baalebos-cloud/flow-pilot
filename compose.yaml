name: flowpilot

services:
  postgres:
    image: postgres:17.10-alpine3.23
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flowpilot}
      POSTGRES_USER: ${POSTGRES_USER:-flowpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-postgres-password}
    volumes:
      - flowpilot-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: flowpilot-backend:local
    ports:
      - "127.0.0.1:${FLOWPILOT_PORT:-8000}:8000"
    environment:
      FLOWPILOT_ENV: ${FLOWPILOT_ENV:-development}
      FLOWPILOT_SECRET: ${FLOWPILOT_SECRET:-dev-only-change-before-deploy-32-bytes}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-flowpilot}:${POSTGRES_PASSWORD:-local-postgres-password}@postgres:5432/${POSTGRES_DB:-flowpilot}
      BMONI_MODE: ${BMONI_MODE:-mock}
      BMONI_BASE_URL: ${BMONI_BASE_URL:-}
      BMONI_API_KEY: ${BMONI_API_KEY:-}
      BMONI_WEBHOOK_SECRET: ${BMONI_WEBHOOK_SECRET:-}
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    init: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  flowpilot-postgres:
